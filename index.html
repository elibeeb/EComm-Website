<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple E-Commerce</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .product {
            transition: 0.3s;
        }

        .product:hover {
            transform: scale(1.03);
        }

        .product img {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">ShopZone</a>

        <button class="btn btn-light" id="cartButton">
            Cart (<span id="cartCount">0</span>)
        </button>
    </div>
</nav>

<div class="container mt-5">

    <h1 class="text-center">Our Products</h1>
    <p class="text-center">Choose your favorite product</p>

    <div class="row mt-4">

        <div class="col-md-4 mb-4">
            <div class="card product">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                     class="card-img-top">

                <div class="card-body">
                    <h5>Headphones</h5>
                    <p>Wireless headphones with good sound quality.</p>
                    <h5>₹2,499</h5>

                    <button class="btn btn-primary addCart"
                            data-price="2499">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card product">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                     class="card-img-top">

                <div class="card-body">
                    <h5>Smart Watch</h5>
                    <p>Smart watch for fitness and daily activities.</p>
                    <h5>₹3,999</h5>

                    <button class="btn btn-primary addCart"
                            data-price="3999">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

        <div class="col-md-4 mb-4">
            <div class="card product">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff"
                     class="card-img-top">

                <div class="card-body">
                    <h5>Sports Shoes</h5>
                    <p>Comfortable shoes for everyday use.</p>
                    <h5>₹1,899</h5>

                    <button class="btn btn-primary addCart"
                            data-price="1899">
                        Add to Cart
                    </button>
                </div>
            </div>
        </div>

    </div>

    <div class="card mt-4 mb-5">
        <div class="card-body">

            <h3>Checkout</h3>

            <form id="checkoutForm">

                <div class="mb-3">
                    <label>Name</label>
                    <input type="text" id="name" class="form-control">
                    <small class="text-danger" id="nameError"></small>
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="text" id="email" class="form-control">
                    <small class="text-danger" id="emailError"></small>
                </div>

                <div class="mb-3">
                    <label>Phone</label>
                    <input type="text" id="phone" class="form-control">
                    <small class="text-danger" id="phoneError"></small>
                </div>

                <div class="mb-3">
                    <label>Address</label>
                    <textarea id="address" class="form-control"></textarea>
                    <small class="text-danger" id="addressError"></small>
                </div>

                <button type="submit" class="btn btn-success">
                    Place Order
                </button>

            </form>

        </div>
    </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>

let cart = 0;

$(".addCart").click(function() {

    cart++;

    $("#cartCount").text(cart);

    $(this).text("Added!");

    setTimeout(() => {
        $(this).text("Add to Cart");
    }, 1000);
});

$("#checkoutForm").submit(function(event) {

    event.preventDefault();

    let name = $("#name").val().trim();
    let email = $("#email").val().trim();
    let phone = $("#phone").val().trim();
    let address = $("#address").val().trim();

    $(".text-danger").text("");

    let valid = true;

    if (name.length < 3) {
        $("#nameError").text("Enter a valid name");
        valid = false;
    }

    let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    if (!emailPattern.test(email)) {
        $("#emailError").text("Enter a valid email");
        valid = false;
    }

    let phonePattern = /^[6-9][0-9]{9}$/;

    if (!phonePattern.test(phone)) {
        $("#phoneError").text("Enter a valid 10-digit phone number");
        valid = false;
    }

    if (address.length < 10) {
        $("#addressError").text("Enter a valid address");
        valid = false;
    }

    if (valid) {

        if (cart == 0) {
            alert("Please add a product to the cart");
            return;
        }

        alert("Order placed successfully!");

        $("#checkoutForm")[0].reset();

        cart = 0;
        $("#cartCount").text(cart);
    }

});

</script>

</body>
</html>
